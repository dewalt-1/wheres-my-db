<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Where's My DB? Live map</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1c1d1f; --muted: #6b6f76;
    --line: #c9ccd1; --rule: #e3e4e7;
    --ok: #2f8f5b; --late: #d98a00; --very-late: #c9302c; --route: #24507a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171a; --panel: #1f2226; --ink: #eceef1; --muted: #9aa0a8;
      --line: #3a3f46; --rule: #2c3036;
      --ok: #4fb783; --late: #f0a92c; --very-late: #ef5b55; --route: #7fb2e5;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--rule);
  }
  h1 { font-size: 16px; margin: 0; white-space: nowrap; }
  form { display: flex; gap: 6px; flex: 1 1 220px; min-width: 0; position: relative; }
  input[type=search] {
    flex: 1; min-width: 0; padding: 7px 10px; font: inherit; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  }
  button {
    font: inherit; padding: 7px 12px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  #results {
    position: absolute; top: 100%; left: 0; right: 0; z-index: 5; margin: 4px 0 0; padding: 0;
    list-style: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    max-height: 50vh; overflow: auto;
  }
  #results:empty { display: none; }
  #results button { display: block; width: 100%; text-align: left; border: 0; border-radius: 0; background: none; }
  #results button:hover, #results button:focus { background: var(--bg); }
  #status { color: var(--muted); font-size: 13px; flex: 1 1 200px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
  main { flex: 1; min-height: 0; display: flex; position: relative; }
  #stage { flex: 1; min-width: 0; min-height: 0; position: relative; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; display: block; }
  aside {
    width: 340px; max-width: 100%; background: var(--panel); border-left: 1px solid var(--rule);
    padding: 14px 16px; overflow: auto; display: none;
  }
  aside.open { display: block; }
  aside h2 { font-size: 16px; margin: 0 0 2px; padding-right: 36px; }
  aside .sub { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  aside .close { position: absolute; right: 12px; top: 10px; padding: 2px 9px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  td { padding: 3px 0; vertical-align: top; }
  td.t, td.d { white-space: nowrap; text-align: right; padding-left: 8px; font-variant-numeric: tabular-nums; }
  tr.passed td { color: var(--muted); }
  tr.here td { color: var(--route); font-weight: 600; }
  .d.late { color: var(--late); } .d.very { color: var(--very-late); }
  .note { color: var(--muted); font-size: 12px; }
  a { color: var(--route); }
  @media (max-width: 720px) {
    main { flex-direction: column; }
    aside { width: 100%; max-height: 45%; border-left: 0; border-top: 1px solid var(--rule); }
  }
</style>
</head>
<body>
<header>
  <h1>Where's My DB?</h1>
  <form id="search" autocomplete="off">
    <input type="search" id="q" placeholder="Search a station, e.g. Köln Hbf" aria-label="Station">
    <button type="submit">Show</button>
    <ul id="results"></ul>
  </form>
  <div class="legend" aria-label="Legend">
    <span><i style="background:var(--ok)"></i>under 5 min</span>
    <span><i style="background:var(--late)"></i>5–14 min late</span>
    <span><i style="background:var(--very-late)"></i>15+ min late</span>
    <span><i style="background:none;border:2px solid var(--very-late)"></i>likely stuck</span>
  </div>
  <div id="status" role="status">Loading…</div>
</header>
<main>
  <div id="stage"><canvas id="map" aria-label="Map of trains"></canvas></div>
  <aside id="panel" aria-live="polite"></aside>
</main>

<script>
"use strict";
const API = "https://api.transitous.org";
const RAIL = new Set(["HIGHSPEED_RAIL", "LONG_DISTANCE", "NIGHT_RAIL", "REGIONAL_FAST_RAIL", "REGIONAL_RAIL", "SUBURBAN", "SUBWAY", "TRAM"]);
const STUCK_GAIN_MIN = 10;
const REFRESH_MS = 60000;
const KM_PER_DEG = 111;

const canvas = document.getElementById("map");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const panel = document.getElementById("panel");
const params = new URLSearchParams(location.search);

// View: world coordinates are km east/north of `origin`; scale is px per km.
const view = { originLat: 51, originLon: 10, scale: 1, tx: 0, ty: 0 };
let scene = { lines: [], trains: [], stops: [], places: [], route: null };
let selectedTrip = null;

const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const minutes = (a, b) => (a && b ? Math.round((Date.parse(b) - Date.parse(a)) / 60000) : 0);
const hhmm = (iso) => (iso ? new Date(iso).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Berlin" }) : "");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function project(lat, lon) {
  return {
    x: (lon - view.originLon) * KM_PER_DEG * Math.cos((view.originLat * Math.PI) / 180),
    y: -(lat - view.originLat) * KM_PER_DEG,
  };
}
const toScreen = (p) => ({ x: p.x * view.scale + view.tx, y: p.y * view.scale + view.ty });

function decodePolyline(str, precision) {
  const factor = 10 ** precision, out = [];
  let i = 0, lat = 0, lon = 0;
  while (i < str.length) {
    for (let k = 0; k < 2; k++) {
      let result = 0, shift = 0, b;
      do { b = str.charCodeAt(i++) - 63; result |= (b & 31) << shift; shift += 5; } while (b >= 32);
      const delta = result & 1 ? ~(result >> 1) : result >> 1;
      if (k === 0) lat += delta; else lon += delta;
    }
    out.push(project(lat / factor, lon / factor));
  }
  return out;
}

// Point at fraction f (0..1) of a polyline's length.
function pointAlong(points, f) {
  if (points.length === 1) return points[0];
  const lengths = [];
  let total = 0;
  for (let i = 1; i < points.length; i++) {
    const d = Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
    lengths.push(d); total += d;
  }
  let target = total * Math.min(1, Math.max(0, f));
  for (let i = 0; i < lengths.length; i++) {
    if (target <= lengths[i] || i === lengths.length - 1) {
      const t = lengths[i] ? target / lengths[i] : 0;
      return { x: points[i].x + (points[i + 1].x - points[i].x) * t, y: points[i].y + (points[i + 1].y - points[i].y) * t };
    }
    target -= lengths[i];
  }
  return points[points.length - 1];
}

function delayColour(min) {
  return min >= 15 ? css("--very-late") : min >= 5 ? css("--late") : css("--ok");
}

function fit(points, padding = 50) {
  if (!points.length) return;
  const xs = points.map((p) => p.x), ys = points.map((p) => p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const w = canvas.clientWidth, h = canvas.clientHeight;
  view.scale = Math.min((w - 2 * padding) / Math.max(maxX - minX, 0.5), (h - 2 * padding) / Math.max(maxY - minY, 0.5));
  view.tx = w / 2 - ((minX + maxX) / 2) * view.scale;
  view.ty = h / 2 - ((minY + maxY) / 2) * view.scale;
}

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w * dpr || canvas.height !== h * dpr) { canvas.width = w * dpr; canvas.height = h * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.lineJoin = "round"; ctx.lineCap = "round";

  const path = (points) => {
    ctx.beginPath();
    points.forEach((p, i) => { const s = toScreen(p); if (i) ctx.lineTo(s.x, s.y); else ctx.moveTo(s.x, s.y); });
    ctx.stroke();
  };

  ctx.strokeStyle = css("--line"); ctx.lineWidth = 2;
  for (const line of scene.lines) path(line);

  if (scene.route) { ctx.strokeStyle = css("--route"); ctx.lineWidth = 5; path(scene.route); }

  ctx.font = "12px system-ui, sans-serif"; ctx.textBaseline = "middle";
  // Draw a label only if it does not overlap one already drawn.
  const taken = [];
  const label = (text, x, y, colour) => {
    const box = { x, y: y - 8, w: ctx.measureText(text).width, h: 16 };
    if (taken.some((b) => box.x < b.x + b.w + 4 && b.x < box.x + box.w + 4 && box.y < b.y + b.h && b.y < box.y + box.h)) return;
    taken.push(box);
    ctx.fillStyle = colour; ctx.fillText(text, x, y);
  };

  for (const stop of scene.stops) {
    const s = toScreen(stop.p);
    ctx.beginPath(); ctx.arc(s.x, s.y, 5, 0, 2 * Math.PI);
    ctx.fillStyle = stop.passed ? css("--route") : css("--bg"); ctx.fill();
    ctx.strokeStyle = css("--route"); ctx.lineWidth = 2; ctx.stroke();
    label(stop.label, s.x + 10, s.y, css("--ink"));
  }

  // Station names first: they orient the reader, so they win over train labels.
  ctx.font = "600 12px system-ui, sans-serif";
  for (const place of scene.places) {
    const s = toScreen(place.p);
    label(place.name, s.x + 6, s.y - 12, css("--muted"));
  }
  ctx.font = "12px system-ui, sans-serif";
  // Then train labels, worst delays first.
  const labelled = scene.trains.filter((t) => t.label).sort((a, b) => b.delay - a.delay);
  for (const train of labelled) {
    const s = toScreen(train.p);
    label(train.label, s.x + 12, s.y, css("--ink"));
  }

  for (const train of scene.trains) {
    const s = toScreen(train.p);
    const r = train.tripId === selectedTrip ? 8 : 5.5;
    ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, 2 * Math.PI);
    ctx.fillStyle = delayColour(train.delay); ctx.fill();
    ctx.strokeStyle = css("--bg"); ctx.lineWidth = 1.5; ctx.stroke();
    if (train.stuck) {
      ctx.beginPath(); ctx.arc(s.x, s.y, r + 4, 0, 2 * Math.PI);
      ctx.strokeStyle = css("--very-late"); ctx.lineWidth = 2; ctx.stroke();
    }
  }
}

async function getJson(path, query) {
  const res = await fetch(`${API}${path}?${new URLSearchParams(query)}`);
  if (!res.ok) throw new Error(`The data service answered with an error (${res.status}).`);
  return res.json();
}

// ---- Area mode: all trains around a point ---------------------------------

async function loadArea(lat, lon, radiusKm, minDelay, refit) {
  view.originLat = lat; view.originLon = lon;
  const dLat = radiusKm / KM_PER_DEG, dLon = radiusKm / (KM_PER_DEG * Math.cos((lat * Math.PI) / 180));
  const now = Date.now();
  const segments = await getJson("/api/v5/map/trips", {
    zoom: 10, min: `${lat - dLat},${lon - dLon}`, max: `${lat + dLat},${lon + dLon}`,
    startTime: new Date(now).toISOString(), endTime: new Date(now + 60000).toISOString(),
  });
  const lines = [], byTrip = new Map(), stations = new Map();
  for (const seg of segments) {
    if (!RAIL.has(seg.mode) || !seg.polyline || !seg.trips?.[0]) continue;
    for (const stop of [seg.from, seg.to]) {
      const inside = stop && Math.abs(stop.lat - lat) <= dLat && Math.abs(stop.lon - lon) <= dLon;
      if (inside && stop.name && !stations.has(stop.name)) stations.set(stop.name, { name: stop.name, importance: stop.importance || 0, p: project(stop.lat, stop.lon) });
    }
    const points = decodePolyline(seg.polyline, 5);
    lines.push(points);
    const dep = Date.parse(seg.departure), arr = Date.parse(seg.arrival);
    const progress = arr > dep ? Math.min(1, Math.max(0, (now - dep) / (arr - dep))) : 0;
    const delay = minutes(seg.scheduledArrival, seg.arrival);
    const gained = delay - minutes(seg.scheduledDeparture, seg.departure);
    const train = {
      tripId: seg.trips[0].tripId, name: seg.trips[0].displayName || seg.mode, delay,
      stuck: gained >= STUCK_GAIN_MIN, from: seg.from?.name, to: seg.to?.name,
      p: pointAlong(points, progress), label: delay >= 15 ? `${seg.trips[0].displayName} +${delay}` : "",
    };
    const inProgress = now >= dep && now <= arr;
    if (!byTrip.has(train.tripId) || inProgress) byTrip.set(train.tripId, train);
  }
  const trains = [...byTrip.values()].sort((a, b) => a.delay - b.delay);
  // Name the busiest stations for orientation.
  const places = [...stations.values()].sort((a, b) => b.importance - a.importance).slice(0, 10);
  scene = { lines, trains, stops: [], places, route: null };
  if (refit) {
    const c = project(lat, lon);
    fit([{ x: c.x - radiusKm, y: c.y - radiusKm }, { x: c.x + radiusKm, y: c.y + radiusKm }], 10);
  }
  const late = trains.filter((t) => t.delay >= minDelay).length, stuck = trains.filter((t) => t.stuck).length;
  statusEl.textContent = `${trains.length} trains, ${late} at least ${minDelay} min late, ${stuck} likely stuck. Updated ${hhmm(new Date(now).toISOString())}. Tap a train for details.`;
  draw();
}

// ---- Train mode: one train's route ----------------------------------------

function stopRows(leg, now) {
  const stops = [leg.from, ...(leg.intermediateStops || []), leg.to];
  const passed = stops.map((s) => Date.parse(s.departure || s.arrival) <= now);
  return stops.map((s, i) => ({
    name: s.name, lat: s.lat, lon: s.lon, passed: passed[i],
    time: hhmm(s.scheduledDeparture || s.scheduledArrival),
    delay: minutes(s.scheduledArrival || s.scheduledDeparture, s.arrival || s.departure),
    platform: s.track && s.scheduledTrack && s.track !== s.scheduledTrack ? `platform ${s.track} (was ${s.scheduledTrack})` : "",
    cancelled: s.cancelled === true, leftAt: Date.parse(s.departure || s.arrival), arriveAt: Date.parse(s.arrival || s.departure),
  }));
}

function renderPanel(leg, rows, tripId, showRouteLink) {
  const last = rows.map((r) => r.passed).lastIndexOf(true);
  const body = rows.map((r, i) => {
    const cls = r.delay >= 15 ? "d very" : r.delay >= 5 ? "d late" : "d";
    const delay = r.cancelled ? "cancelled" : r.delay >= 1 ? `+${r.delay} min` : "on time";
    const here = i === last && i < rows.length - 1 ? `<tr class="here"><td colspan="3">▼ train is around here</td></tr>` : "";
    return `<tr class="${r.passed ? "passed" : ""}"><td>${r.passed ? "●" : "○"} ${esc(r.name)}${r.platform ? `<div class="note">${esc(r.platform)}</div>` : ""}</td><td class="t">${r.time}</td><td class="${cls}">${delay}</td></tr>${here}`;
  }).join("");
  const live = leg.realTime ? "live data" : "timetable only, no live data";
  const link = showRouteLink ? `<p><a href="?trip=${encodeURIComponent(tripId)}">Show this train's whole route</a></p>` : "";
  panel.innerHTML = `<button class="close" aria-label="Close">×</button><h2>${esc(leg.displayName || leg.mode)} → ${esc(leg.headsign)}</h2><div class="sub">${live}${leg.cancelled ? " · this run is cancelled" : ""}</div>${link}<table>${body}</table>`;
  panel.classList.add("open");
  panel.querySelector(".close").onclick = () => { panel.classList.remove("open"); selectedTrip = null; draw(); };
  draw();
}

async function showTrainPanel(tripId) {
  selectedTrip = tripId;
  panel.innerHTML = "<p>Loading train…</p>"; panel.classList.add("open"); draw();
  try {
    const leg = (await getJson("/api/v5/trip", { tripId })).legs[0];
    renderPanel(leg, stopRows(leg, Date.now()), tripId, true);
  } catch (err) { panel.innerHTML = `<p>${esc(err.message)}</p>`; }
}

async function loadTrain(tripId, refit) {
  const notFound = "That train run was not found. It may have finished, or the link is from another day.";
  const leg = (await getJson("/api/v5/trip", { tripId }).catch(() => { throw new Error(notFound); })).legs?.[0];
  if (!leg) throw new Error(notFound);
  const now = Date.now(), rows = stopRows(leg, now);
  view.originLat = rows[0].lat; view.originLon = rows[0].lon;
  const stopPoints = rows.map((r) => project(r.lat, r.lon));
  const route = leg.legGeometry?.points ? decodePolyline(leg.legGeometry.points, leg.legGeometry.precision ?? 6) : stopPoints;
  const stops = rows.map((r, i) => ({ p: stopPoints[i], passed: r.passed, label: `${r.name}${r.delay >= 1 ? `  +${r.delay}` : ""}` }));
  const trains = [];
  const last = rows.map((r) => r.passed).lastIndexOf(true);
  if (leg.realTime && last >= 0 && last < rows.length - 1) {
    const a = rows[last], b = rows[last + 1];
    const f = b.arriveAt > a.leftAt ? Math.min(1, Math.max(0, (now - a.leftAt) / (b.arriveAt - a.leftAt))) : 0;
    const pa = stopPoints[last], pb = stopPoints[last + 1];
    trains.push({ tripId, delay: b.delay, stuck: false, label: "", p: { x: pa.x + (pb.x - pa.x) * f, y: pa.y + (pb.y - pa.y) * f } });
  }
  selectedTrip = tripId;
  scene = { lines: [], trains, stops, places: [], route };
  if (refit) fit(stopPoints, 70);
  statusEl.textContent = `${leg.displayName || leg.mode} → ${leg.headsign}. Updated ${hhmm(new Date(now).toISOString())}.`;
  renderPanel(leg, rows, tripId, false);
}

// ---- Interaction ----------------------------------------------------------

const pointers = new Map();
let moved = false;
canvas.addEventListener("pointerdown", (e) => { canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = false; });
canvas.addEventListener("pointermove", (e) => {
  const prev = pointers.get(e.pointerId);
  if (!prev) return;
  const rect = canvas.getBoundingClientRect();
  if (pointers.size === 2) {
    const other = [...pointers.entries()].find(([id]) => id !== e.pointerId)[1];
    const before = Math.hypot(prev.x - other.x, prev.y - other.y), after = Math.hypot(e.clientX - other.x, e.clientY - other.y);
    if (before > 0) zoomAt((e.clientX + other.x) / 2 - rect.left, (e.clientY + other.y) / 2 - rect.top, after / before);
  } else {
    view.tx += e.clientX - prev.x; view.ty += e.clientY - prev.y;
  }
  if (Math.hypot(e.clientX - prev.x, e.clientY - prev.y) > 2) moved = true;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  draw();
});
const endPointer = (e) => {
  if (pointers.size === 1 && !moved && e.type === "pointerup") pick(e);
  pointers.delete(e.pointerId);
};
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  zoomAt(e.clientX - rect.left, e.clientY - rect.top, Math.exp(-e.deltaY * 0.0015));
  draw();
}, { passive: false });

function zoomAt(x, y, factor) {
  const next = Math.min(400, Math.max(0.3, view.scale * factor));
  const k = next / view.scale;
  view.tx = x - (x - view.tx) * k; view.ty = y - (y - view.ty) * k; view.scale = next;
}

function pick(e) {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  let best = null, bestDistance = 18;
  for (const train of scene.trains) {
    const s = toScreen(train.p), d = Math.hypot(s.x - x, s.y - y);
    if (d < bestDistance) { best = train; bestDistance = d; }
  }
  if (best && !params.get("trip")) showTrainPanel(best.tripId);
}

// ---- Station search --------------------------------------------------------

const results = document.getElementById("results");
document.getElementById("search").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = document.getElementById("q").value.trim();
  if (!text) return;
  results.innerHTML = "<li><button disabled>Searching…</button></li>";
  try {
    const stops = (await getJson("/api/v1/geocode", { text, type: "STOP" })).filter((s) => s.type === "STOP").slice(0, 8);
    results.innerHTML = stops.length
      ? stops.map((s) => `<li><button type="button" data-lat="${s.lat}" data-lon="${s.lon}">${esc(s.name)}</button></li>`).join("")
      : "<li><button disabled>No station found</button></li>";
  } catch (err) { results.innerHTML = `<li><button disabled>${esc(err.message)}</button></li>`; }
});
results.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-lat]");
  if (b) location.search = `?lat=${b.dataset.lat}&lon=${b.dataset.lon}`;
});

// ---- Start -----------------------------------------------------------------

async function refresh(refit) {
  try {
    if (params.get("trip")) {
      await loadTrain(params.get("trip"), refit);
    } else {
      // Default: Köln Hbf, where this project started.
      const lat = Number(params.get("lat")) || 50.943, lon = Number(params.get("lon")) || 6.959;
      const radius = Math.min(150, Math.max(5, Number(params.get("r")) || 40));
      const minDelay = Math.max(0, Number(params.get("min")) || 5);
      await loadArea(lat, lon, radius, minDelay, refit);
    }
  } catch (err) {
    statusEl.textContent = `Could not load live data: ${err.message}`;
  }
}

window.addEventListener("resize", draw);
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
refresh(true);
setInterval(() => refresh(false), REFRESH_MS);
</script>
</body>
</html>
